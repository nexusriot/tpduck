name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: version to build, e.g. v0.3.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so `git describe` sees the tag

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: work out the version
        id: version
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Never ship something that does not pass its own tests.
      - name: tests
        run: CGO_ENABLED=1 go test ./... -race -count=1

      - name: end-to-end
        run: make e2e

      - name: build archives and packages
        run: make packages VERSION=${{ steps.version.outputs.version }}

      - name: checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm >> SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: tpduck ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
